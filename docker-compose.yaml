services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    restart: unless-stopped
    depends_on:
      - qdrant
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      JWT_SECRET: ${JWT_SECRET}
      ORIGINI_CONSENTITE: ${ORIGINI_CONSENTITE:-http://localhost:3000}
      QDRANT_URL: http://qdrant:6333
      DB_PATH: /data/app.db
      CARTELLA_UPLOAD: /data/uploads
      # Sul volume, non nella working directory del container: altrimenti
      # conversazioni e memorie si perderebbero a ogni redeploy.
      CHECKPOINT_DB: /data/checkpoints.sqlite
      STORE_DB: /data/store.sqlite
      # Reranking: SPENTO se non impostata. Chi non lo configura non deve
      # pagarne nulla — né il download, né la RAM, né la latenza.
      RERANKER: ${RERANKER:-off}
      MODELLO_RERANKER: ${MODELLO_RERANKER:-BAAI/bge-reranker-v2-m3}
      # Cache dei modelli HuggingFace. NON impostata di default: si eredita
      # quella dell'immagine, che è il comportamento che l'app aveva prima che
      # il reranker esistesse.
      #
      # La sintassi senza valore ("HF_HOME:" e basta) passa la variabile solo
      # se esiste nell'ambiente; scrivere ${HF_HOME:-} la imposterebbe a
      # stringa vuota, e HuggingFace risolve la stringa vuota nel path
      # RELATIVO "hub" — cioè /app/hub dentro il container, effimero e
      # ricreato a ogni riavvio. Peggio che non impostarla affatto.
      #
      # Vale la pena valorizzarla (es. /data/hf) SOLO con RERANKER=on, per non
      # riscaricare 2,3 GB a ogni redeploy: sposta sul volume anche i ~120 MB
      # dell'embedding, quindi va fatto verificando che il volume sia
      # scrivibile dall'utente del container.
      HF_HOME:
      # Tracing LangSmith: se LANGSMITH_TRACING non è impostata resta spento
      # e l'app funziona normalmente. LANGSMITH_ENDPOINT serve solo agli
      # account sulla regione europea (il default punta agli Stati Uniti).
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-rag-allenamento}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-}
    volumes:
      - app_data:/data
    expose:
      - "8000"

volumes:
  qdrant_data:
  app_data:
